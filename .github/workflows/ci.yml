name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: botasdonchuy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: "4001"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/botasdonchuy_test
      JWT_SECRET: test-jwt-secret-not-for-production
      JWT_EXPIRES_IN: 1h
      BCRYPT_ROUNDS: "4"
      CORS_ORIGIN: http://localhost:3000
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-key
      CLOUDINARY_API_SECRET: test-secret
      SKYDROPX_CLIENT_ID: test-client-id
      SKYDROPX_CLIENT_SECRET: test-client-secret
      SKYDROPX_WEBHOOK_SECRET: test-skydropx-webhook-secret
      SHIP_FROM_STREET: Calle Falsa
      SHIP_FROM_EXTERNAL_NUMBER: "123"
      SHIP_FROM_NEIGHBORHOOD: Centro
      SHIP_FROM_CITY: Celaya
      SHIP_FROM_STATE: GTO
      SHIP_FROM_POSTAL_CODE: "38000"
      SHIP_FROM_NAME: Botas Don Chuy
      SHIP_FROM_PHONE: "4610000000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_test_dummy
      STRIPE_CURRENCY: mxn
      RESEND_API_KEY: re_test_dummy
      EMAIL_FROM: onboarding@resend.dev
      FRONTEND_URL: http://localhost:3000
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (type-check)
        run: pnpm build

      - name: Run tests
        run: pnpm test
