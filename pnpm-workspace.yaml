# Parches de seguridad a dependencias TRANSITIVAS. `pnpm update` no las toca
# —solo mueve dependencias directas—, y los padres que las arrastran siguen
# publicando rangos (`^1.1.7`, `^3.13.1`) que admiten la versión corregida pero
# que nadie ha re-resuelto. El override la fija desde aquí.
#
# La clave lleva la línea mayor (`@1`, `@3`) a propósito: solo afecta a esa
# rama. Las otras versiones instaladas en paralelo (brace-expansion 2.x y 5.x)
# ya salieron parcheadas con un `pnpm update` normal y no necesitan pin.
#
# El valor es un rango (`^`), no una versión exacta: así los parches siguientes
# entran solos y esto no se convierte en un candado que haya que recordar.
# Cuando los padres actualicen sus propios rangos, estas dos líneas sobran.
overrides:
  # CVE-2026-13149 / CVE-2026-14257 / CVE-2026-69152 — DoS por expansión
  # ilimitada. Llega vía minimatch@3 → glob@7 (archiver → exceljs).
  'brace-expansion@1': ^1.1.18
  # CVE-2026-59870 — consumo cuadrático de CPU resolviendo `!!omap`.
  # Llega vía @istanbuljs/load-nyc-config (cobertura de jest).
  'js-yaml@3': ^3.15.1

allowBuilds:
  '@scarf/scarf': false
  bcrypt: true
  # Resolver nativo transitivo (llega vía ts-jest → jest). Los tests no necesitan su
  # build nativo — el fallback en JS basta — así que no se compila.
  unrs-resolver: false
